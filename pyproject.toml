[project]
name = "deltaforge"
version = "0.1.0"
description = "Directional options overlay on the ML30 signal — backtest and analysis"
requires-python = ">=3.13"
dependencies = [
    "alpaca-py>=0.43",
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.14",
    "pandas-market-calendars>=4.4",
    "pyarrow>=17.0",
    "structlog>=24.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deltaforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
