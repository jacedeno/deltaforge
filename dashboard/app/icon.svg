<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Favicon: the mark on its own dark tile, so it holds against light and
       dark browser chrome alike. Colours are literal rather than tokens —
       a favicon is fetched standalone and has no page to inherit from. The
       strike line is the tile colour for the same reason. -->
  <defs>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b79ef0"/><stop offset="1" stop-color="#8b6ce0"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b6ce0"/><stop offset="1" stop-color="#5f3cc0"/>
    </linearGradient>
    <clipPath id="tri"><path d="M32 13 L53 50 L11 50 Z"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="#16181c"/>
  <g clip-path="url(#tri)">
    <rect x="0" y="0" width="32" height="64" fill="url(#lit)"/>
    <rect x="32" y="0" width="32" height="64" fill="url(#shade)"/>
    <rect x="0" y="43.4" width="64" height="2.4" fill="#16181c"/>
  </g>
</svg>
