<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="DeltaForge">
  <!-- Standalone mark, for anywhere outside the app that cannot read the theme
       tokens. Transparent behind the strike line so it sits on any surface. -->
  <defs>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b79ef0"/><stop offset="1" stop-color="#8b6ce0"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b6ce0"/><stop offset="1" stop-color="#5f3cc0"/>
    </linearGradient>
    <mask id="strike">
      <rect width="64" height="64" fill="#fff"/>
      <rect x="0" y="44.5" width="64" height="2.6" fill="#000"/>
    </mask>
    <clipPath id="tri"><path d="M32 9 L55 52 L9 52 Z"/></clipPath>
  </defs>
  <g clip-path="url(#tri)" mask="url(#strike)">
    <rect x="0" y="0" width="32" height="64" fill="url(#lit)"/>
    <rect x="32" y="0" width="32" height="64" fill="url(#shade)"/>
  </g>
</svg>
